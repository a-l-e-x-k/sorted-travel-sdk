[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sorted-travel"
version = "0.1.0"
description = "Official Python SDK and CLI for the Sorted Travel REST API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sorted Travel", email = "support@sorted.travel" },
]
keywords = [
    "sorted-travel",
    "travel",
    "api-client",
    "sdk",
    "destinations",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://sorted.travel"
Documentation = "https://sorted.travel/sdks.md"
"Developer portal" = "https://sorted.travel/developers"
Repository = "https://github.com/a-l-e-x-k/sorted-travel-sdk"
Issues = "https://github.com/a-l-e-x-k/sorted-travel-sdk/issues"

[project.scripts]
sorted-travel = "sorted_travel.cli:main"
