name: publish-ruby

on:
  release:
    types: [published]

jobs:
  rubygems:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - name: Run Ruby unit tests
        run: ruby -Ilib -Itest test/test_client.rb
      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a
      - name: Build gem
        run: gem build sorted_travel.gemspec
      - name: Publish to RubyGems
        run: gem push sorted-travel-*.gem
