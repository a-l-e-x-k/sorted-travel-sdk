name: publish-go

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Verify Go module builds
        run: go test ./... -v
        working-directory: go
      - name: Publish note
        run: |
          echo "Go modules publish via git tags. After this release, tag the Go module:"
          echo "  git tag go/${GITHUB_REF_NAME}"
          echo "  git push origin go/${GITHUB_REF_NAME}"
